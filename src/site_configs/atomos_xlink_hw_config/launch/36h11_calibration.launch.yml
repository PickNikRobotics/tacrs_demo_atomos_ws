launch:
- arg:
    name: device
    default: "0"

- node_container:
    pkg: rclcpp_components
    exec: component_container
    name: apriltag_container
    namespace: ""
    composable_node:
    - pkg: apriltag_ros
      plugin: AprilTagNode
      name: apriltag
      namespace: apriltag
      remap:
      - from: /apriltag/image_rect
        to: /camera/scene_camera/color/image_raw
      - from: /apriltag/camera_info
        to: /camera/scene_camera/color/camera_info
      - from: /apriltag/rgbd
        to: /camera/scene_camera/rgbd
      param:
      - from: $(find-pkg-share atomos_xlink_hw_config)/launch/tags_36h11_calibration.yaml
      extra_arg:
      - name: use_intra_process_comms
        value: "True"
